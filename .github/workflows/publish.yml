name: Publish

# Trusted publishing: npm mints a short-lived credential from the OIDC token
# GitHub hands this workflow, so there is no npm token in the repo and no OTP
# prompt. The trust is registered on npmjs.com, against this exact file name.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # The OIDC token *is* the credential — without this the publish is
      # anonymous and npm rejects it.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Deliberately no `registry-url`: that writes an .npmrc pinning
      # `_authToken=${NODE_AUTH_TOKEN}`, and with no token in the environment
      # npm sends setup-node's placeholder instead of exchanging the OIDC
      # token. The registry answers 404, which reads like a missing package.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Trusted publishing needs npm 11.5.1+; Node 24 still ships npm 11.0.x.
      - run: npm install -g npm@latest

      - run: npm --version

      - run: npm ci

      - run: npm test

      # A tag pointing at a tree whose version was never bumped would publish
      # under the wrong number, or fail late with a confusing 403.
      - name: Check the tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $pkg" >&2
            exit 1
          fi

      # `prepare` rebuilds from the clean tree, so dist/ is whatever this commit
      # produces — never a stale local build.
      - run: npm publish
